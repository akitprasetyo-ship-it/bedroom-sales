<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Bedroom (BF) — Informa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg: #201A15;
    --panel: #2A231C;
    --panel-border: #3C332A;
    --gold: #CB9A46;
    --gold-soft: #8A6B34;
    --sage: #7FA184;
    --clay: #C0654A;
    --text: #F3EBDD;
    --muted: #9C8E7C;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-variant-numeric: tabular-nums;
    line-height: 1.45;
    padding: 28px 20px 60px;
  }
  .wrap{ max-width: 760px; margin: 0 auto; }

  header.page{ margin-bottom: 30px; }
  .dept-label{ color: var(--muted); font-size: 0.95rem; }
  h1{
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 2rem;
    margin: 4px 0 0;
    letter-spacing: -0.01em;
  }

  .hero{ margin: 34px 0 40px; }
  .hero-number{
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 5rem;
    line-height: 1;
    margin: 0;
    color: var(--gold);
  }
  .hero-number.under{ color: var(--clay); }
  .hero-number.over{ color: var(--sage); }
  .hero-sub{ color: var(--muted); margin-top: 6px; font-size: 0.95rem; }

  .progress-track{
    height: 8px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 5px;
    margin-top: 18px;
    overflow: hidden;
  }
  .progress-fill{
    height: 100%;
    background: linear-gradient(90deg, var(--gold-soft), var(--gold));
    width: 0%;
    transition: width 1.1s cubic-bezier(.2,.7,.3,1);
  }
  .progress-fill.over{ background: linear-gradient(90deg, #5C7D60, var(--sage)); }
  .progress-fill.under{ background: linear-gradient(90deg, #8C4634, var(--clay)); }

  .figures{ display:flex; justify-content:space-between; margin-top: 12px; font-size: 0.92rem; color: var(--muted); }
  .figures strong{ color: var(--text); font-weight: 500; }

  section.block{ margin-top: 44px; }
  .block-title{
    font-family: 'Fraunces', serif;
    font-size: 1.3rem;
    font-weight: 500;
    margin: 0 0 4px;
  }
  .block-sub{ color: var(--muted); font-size: 0.88rem; margin-bottom: 18px; }

  .smt-row{
    display:flex;
    align-items:center;
    gap: 14px;
    padding: 13px 0;
    border-bottom: 1px solid var(--panel-border);
  }
  .smt-row:first-child{ border-top: 1px solid var(--panel-border); }
  .smt-rank{ color: var(--muted); font-size: 0.85rem; width: 18px; flex-shrink:0; }
  .smt-name{ flex: 1 1 auto; min-width: 0; font-weight: 500; }
  .smt-bar-wrap{ flex: 1 1 120px; min-width: 80px; }
  .smt-bar-track{ height: 6px; background: var(--panel); border-radius: 4px; overflow:hidden; }
  .smt-bar-fill{ height:100%; width:0%; border-radius:4px; transition: width 1s ease; background: var(--gold); }
  .smt-bar-fill.over{ background: var(--sage); }
  .smt-bar-fill.under{ background: var(--clay); }
  .smt-pct{ width: 52px; text-align:right; font-size: 0.9rem; flex-shrink:0; }
  .smt-pct.over{ color: var(--sage); }
  .smt-pct.under{ color: var(--clay); }

  .chart-panel{
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 20px 16px 10px;
    background: var(--panel);
  }

  .state-msg{ color: var(--muted); font-size: 0.9rem; padding: 20px 0; }
  .state-msg.error{ color: var(--clay); }

  footer{ margin-top: 50px; color: var(--muted); font-size: 0.8rem; }

  @media (min-width: 640px){
    body{ padding: 48px 32px 80px; }
    h1{ font-size: 2.3rem; }
    .hero-number{ font-size: 6.5rem; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="page">
    <div class="dept-label">Informa Samarinda · Product Specialist</div>
    <h1 id="deptTitle">Bedroom (BF)</h1>
  </header>

  <div class="hero">
    <div class="hero-sub">Pencapaian bulan ini</div>
    <p class="hero-number" id="heroPct">–</p>
    <div class="progress-track"><div class="progress-fill" id="heroBar"></div></div>
    <div class="figures">
      <span>Pencapaian: <strong id="heroActual">–</strong></span>
      <span>Target: <strong id="heroTarget">–</strong></span>
    </div>
  </div>

  <section class="block">
    <div class="block-title">Tim SMT</div>
    <div class="block-sub">Diurutkan dari pencapaian tertinggi</div>
    <div id="smtList"><div class="state-msg">Memuat data…</div></div>
  </section>

  <section class="block">
    <div class="block-title">Tren bulanan</div>
    <div class="block-sub">Target vs pencapaian departemen, per bulan</div>
    <div class="chart-panel">
      <canvas id="trendChart" height="180"></canvas>
    </div>
  </section>

  <footer id="lastUpdate"></footer>
</div>

<script>
/* =========================================================
   KONFIGURASI — sesuaikan dengan Google Sheet Anda
   ========================================================= */
const CONFIG = {
  // ID Google Sheet, diambil dari URL:
  // https://docs.google.com/spreadsheets/d/GANTI_INI/edit
  SHEET_ID: '18rUQK07GJ8RlqKzmMQ2JRj95t0lcBuhS-3zDWwAo5Tw',

  // Tab berisi daftar SMT & nama tab data mentah masing-masing.
  // Kolom: Nama | Tab
  // (kolom "Tab" = nama tab yang berisi transaksi harian orang itu;
  //  kalau kosong, nama tab dianggap sama dengan "Nama")
  ROSTER_TAB: 'Roster',

  // Tab berisi target bulanan. Kolom:
  // Bulan | Target Departemen | Jumlah Sales
  // Kolom "Bulan" WAJIB format YYYY-MM, contoh: 2026-06
  // Target per SMT dihitung otomatis = Target Departemen / Jumlah Sales
  TARGET_TAB: 'Target',

  // Kode departemen yang difilter dari kolom DEPT di data mentah
  DEPT_CODE: 'BF',

  DEPARTMENT_NAME: 'Bedroom (BF)',

  // Format angka jadi Rupiah ringkas (Rp 12,3 jt). Ubah ke false
  // untuk menampilkan angka penuh.
  FORMAT_RUPIAH_RINGKAS: true,
};
/* ========================================================= */

document.getElementById('deptTitle').textContent = CONFIG.DEPARTMENT_NAME;

const MONTH_NAMES = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];

function fmt(n){
  if (n === null || n === undefined || isNaN(n)) return '–';
  if (CONFIG.FORMAT_RUPIAH_RINGKAS){
    if (Math.abs(n) >= 1e9) return 'Rp ' + (n/1e9).toFixed(2).replace('.', ',') + ' M';
    if (Math.abs(n) >= 1e6) return 'Rp ' + (n/1e6).toFixed(1).replace('.', ',') + ' jt';
    if (Math.abs(n) >= 1e3) return 'Rp ' + (n/1e3).toFixed(0) + ' rb';
  }
  return 'Rp ' + n.toLocaleString('id-ID');
}

function pctClass(pct){
  if (pct >= 100) return 'over';
  if (pct < 80) return 'under';
  return '';
}

function currentMonthKey(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

function formatMonthLabel(monthKey){
  const [y, m] = String(monthKey).split('-');
  const idx = parseInt(m, 10) - 1;
  return (MONTH_NAMES[idx] || m) + ' ' + y;
}

function num(v){
  if (typeof v === 'number') return v;
  const n = typeof v === 'string' ? parseFloat(v.replace(/[^0-9.-]/g, '')) : v;
  return isNaN(n) ? 0 : n;
}

// Google Sheets sering otomatis mengubah teks "2026-09" jadi tanggal.
// gviz mengirim tanggal sebagai string literal "Date(2026,8,1)" (bulan 0-indexed).
// Fungsi ini menerima baik format itu maupun teks biasa "2026-09" / "2026-09-01".
function parseBulanValue(raw){
  if (raw === null || raw === undefined) return '';
  const str = String(raw).trim();
  const dateMatch = str.match(/^Date\((\d+),(\d+),(\d+)/);
  if (dateMatch){
    const y = dateMatch[1];
    const m = String(parseInt(dateMatch[2], 10) + 1).padStart(2, '0');
    return `${y}-${m}`;
  }
  const isoMatch = str.match(/^(\d{4})-(\d{2})/);
  if (isoMatch) return `${isoMatch[1]}-${isoMatch[2]}`;
  return str;
}

// Ambil tanggal (YYYYMMDD) yang tertanam di nomor RECEIPT, lalu ubah jadi "YYYY-MM"
function monthKeyFromReceipt(receipt){
  if (!receipt) return null;
  const match = String(receipt).match(/(\d{8})/);
  if (!match) return null;
  const digits = match[1];
  return digits.substring(0, 4) + '-' + digits.substring(4, 6);
}

async function fetchSheet(tabName){
  const url = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(tabName)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('Gagal mengambil sheet: ' + tabName);
  const text = await res.text();
  const start = text.indexOf('{');
  const end = text.lastIndexOf('}');
  const json = JSON.parse(text.substring(start, end + 1));
  const cols = json.table.cols.map(c => (c.label || c.id || '').trim());
  return json.table.rows
    .filter(r => r.c && r.c.some(c => c && c.v !== null && c.v !== ''))
    .map(r => {
      const obj = {};
      cols.forEach((col, i) => {
        const cell = r.c[i];
        obj[col] = cell ? cell.v : null;
      });
      return obj;
    });
}

function renderHero(target, actual){
  const pct = target > 0 ? (actual / target) * 100 : 0;
  const cls = pctClass(pct);
  const heroEl = document.getElementById('heroPct');
  heroEl.textContent = pct.toFixed(0) + '%';
  heroEl.className = 'hero-number ' + cls;
  document.getElementById('heroActual').textContent = fmt(actual);
  document.getElementById('heroTarget').textContent = fmt(target);
  const bar = document.getElementById('heroBar');
  bar.className = 'progress-fill ' + cls;
  requestAnimationFrame(() => { bar.style.width = Math.min(pct, 100) + '%'; });
}

function renderSmtList(rows){
  const container = document.getElementById('smtList');
  if (!rows.length){
    container.innerHTML = '<div class="state-msg">Belum ada data SMT untuk bulan ini.</div>';
    return;
  }
  const sorted = [...rows].sort((a, b) => b.pct - a.pct);

  container.innerHTML = sorted.map((r, i) => {
    const cls = pctClass(r.pct);
    return `<div class="smt-row">
      <div class="smt-rank">${i + 1}</div>
      <div class="smt-name">${r.name}</div>
      <div class="smt-bar-wrap"><div class="smt-bar-track"><div class="smt-bar-fill ${cls}" style="width:${Math.min(r.pct,100)}%"></div></div></div>
      <div class="smt-pct ${cls}">${r.pct.toFixed(0)}%</div>
    </div>`;
  }).join('');
}

function renderTrendChart(rows){
  const labels = rows.map(r => formatMonthLabel(r.bulan));
  const targets = rows.map(r => r.target);
  const actuals = rows.map(r => r.actual);

  const ctx = document.getElementById('trendChart').getContext('2d');
  new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        {
          label: 'Target',
          data: targets,
          backgroundColor: 'rgba(156, 142, 124, 0.35)',
          borderRadius: 3,
        },
        {
          label: 'Pencapaian',
          data: actuals,
          backgroundColor: '#CB9A46',
          borderRadius: 3,
        }
      ]
    },
    options: {
      responsive: true,
      plugins: {
        legend: {
          labels: { color: '#F3EBDD', font: { family: 'IBM Plex Sans' } }
        }
      },
      scales: {
        x: { ticks: { color: '#9C8E7C' }, grid: { display: false } },
        y: {
          ticks: {
            color: '#9C8E7C',
            callback: (v) => fmt(v)
          },
          grid: { color: '#3C332A' }
        }
      }
    }
  });
}

async function init(){
  let deptMonthly = {};
  let targetByMonth = {};

  // ===== Bagian 1: Roster, Target, data mentah -> Hero + daftar SMT =====
  try {
    const [roster, targetRows] = await Promise.all([
      fetchSheet(CONFIG.ROSTER_TAB),
      fetchSheet(CONFIG.TARGET_TAB),
    ]);

    const smtList = roster
      .filter(r => r['Nama'])
      .map(r => ({ name: r['Nama'], tab: r['Tab'] || r['Nama'] }));

    const rawPerSmt = await Promise.all(
      smtList.map(s => fetchSheet(s.tab).catch(() => []))
    );

    const smtMonthly = smtList.map(() => ({}));

    rawPerSmt.forEach((rows, idx) => {
      rows.forEach(row => {
        if (String(row['DEPT'] || '').trim() !== CONFIG.DEPT_CODE) return;
        const mKey = monthKeyFromReceipt(row['RECEIPT']);
        if (!mKey) return;
        const total = num(row['TOTAL']);
        deptMonthly[mKey] = (deptMonthly[mKey] || 0) + total;
        smtMonthly[idx][mKey] = (smtMonthly[idx][mKey] || 0) + total;
      });
    });

    targetRows.forEach(r => {
      const bulan = parseBulanValue(r['Bulan']);
      if (!bulan) return;
      targetByMonth[bulan] = {
        targetDept: num(r['Target Departemen']),
        jumlahSales: num(r['Jumlah Sales']),
      };
    });

    const curKey = currentMonthKey();
    const curTarget = targetByMonth[curKey] || { targetDept: 0, jumlahSales: smtList.length || 1 };
    const perSmtTarget = curTarget.jumlahSales > 0 ? curTarget.targetDept / curTarget.jumlahSales : 0;
    const deptActualCur = deptMonthly[curKey] || 0;

    renderHero(curTarget.targetDept, deptActualCur);

    const smtRows = smtList.map((s, idx) => {
      const actual = smtMonthly[idx][curKey] || 0;
      const pct = perSmtTarget > 0 ? (actual / perSmtTarget) * 100 : 0;
      return { name: s.name, target: perSmtTarget, actual, pct };
    });
    renderSmtList(smtRows);

    document.getElementById('lastUpdate').textContent =
      'Data dimuat: ' + new Date().toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' });
  } catch (err) {
    document.getElementById('smtList').innerHTML =
      `<div class="state-msg error">Gagal memuat data. Pastikan Sheet ID benar, sheet sudah dipublikasikan ("Anyone with the link" — Viewer), dan tab Roster/Target sudah diisi. Detail: ${err.message}</div>`;
    return; // hero & SMT gagal total -> jangan lanjut ke grafik dengan data kosong
  }

  // ===== Bagian 2: Grafik tren (terpisah, tidak menimpa bagian 1 kalau gagal) =====
  try {
    const trendRows = Object.keys(targetByMonth)
      .sort()
      .map(bulan => ({
        bulan,
        target: targetByMonth[bulan].targetDept,
        actual: deptMonthly[bulan] || 0,
      }));
    renderTrendChart(trendRows);
  } catch (err) {
    document.querySelector('.chart-panel').innerHTML =
      `<div class="state-msg error">Grafik tren gagal dimuat (biasanya karena CDN Chart.js diblokir jaringan). Detail: ${err.message}</div>`;
  }
}

init();
</script>
</body>
</html>
